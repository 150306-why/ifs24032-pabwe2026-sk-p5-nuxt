[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API: /api/cash-flows -> https://open-api.delcom.org/api/v1/cash-flows
[[redirects]]
  from = "/api/*"
  to = "https://open-api.delcom.org/api/v1/:splat"
  status = 200
  force = true

# SPA fallback agar /auth/login, /profile, dst. tidak 404 saat dibuka langsung
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
